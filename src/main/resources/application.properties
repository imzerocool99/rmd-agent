agent.interval=3600000

trade.max.qty=5

ollama.url=http://localhost:11434/api/generate
ollama.model=phi3

# LLM generation parameters — tune these to change response style
# temperature: 0.0 = deterministic/factual, 1.0 = creative/varied. Keep 0.2-0.4 for financial advice.
ollama.temperature=0.3
# top_p: nucleus sampling. 0.9 is a safe default.
ollama.top_p=0.9
# num_predict: max tokens to generate per response (~4 chars per token). 256 = ~1024 chars.
ollama.num_predict=150

# Multipart file upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
